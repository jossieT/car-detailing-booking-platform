version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: booking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pass2546
      POSTGRES_DB: car_detailing
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: booking_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
